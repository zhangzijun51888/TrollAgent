name: build-tweak

on:
  workflow_dispatch:
    inputs:
      tweak:
        description: 'Tweak dir name'
        required: true
        default: 'CompileProbe'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git perl rsync dpkg fakeroot \
            xz-utils zip unzip curl ca-certificates libssl-dev zlib1g-dev

      - name: Install ldid
        run: |
          set -x
          curl -fsSL -o /tmp/ldid.deb \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64.deb
          sudo dpkg -i /tmp/ldid.deb || sudo apt-get -f install -y
          ldid -v

      - name: Checkout theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(id -u):$(id -g)" /opt/theos

      - name: Prepare theos SDK
        run: |
          export THEOS=/opt/theos
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -fsSL -o sdk.tar.xz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz || true
          if file sdk.tar.xz | grep -q gzip; then
            mv sdk.tar.xz sdk.tar.gz && tar -xzf sdk.tar.gz --strip-components=1 --wildcards '*/iPhoneOS*.sdk'
          else
            tar -xJf sdk.tar.xz
          fi
          rm -f sdk.tar.*
          ls -d "$THEOS/sdks"/*
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build tweak
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1

      - name: Verify artifacts
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          ls -lh .theos/obj/debug/ 2>/dev/null || true
          ls -lh packages/ 2>/dev/null || true
          file .theos/obj/debug/*.dylib 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweak-${{ inputs.tweak }}
          path: |
            tweaks/${{ inputs.tweak }}/.theos/obj/debug/*.dylib
            tweaks/${{ inputs.tweak }}/packages/*.deb
          if-no-files-found: error
