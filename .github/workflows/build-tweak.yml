name: build-tweak

on:
  workflow_dispatch:
    inputs:
      tweak:
        description: 'Tweak dir name'
        required: true
        default: 'CompileProbe'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git perl rsync \
            libplist-utils libssl-dev dpkg fakeroot xz-utils zip unzip curl \
            gnupg ca-certificates
          # theos 需要 ldid：优先用 deb 直装，失败则从源码编译
          curl -fsSL -o /tmp/ldid.deb https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64.deb || true
          if [ -s /tmp/ldid.deb ]; then sudo dpkg -i /tmp/ldid.deb || true; fi
          command -v ldid || echo "ldid missing, will build from source"
          sudo git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src || true
          if ! command -v ldid && [ -d /tmp/ldid-src ]; then
            cd /tmp/ldid-src && sudo git submodule update --init --recursive
            sudo make -j"$(nproc)" || true
            sudo cp ldid /usr/local/bin/ldid || true
          fi
          ldid -v || true

      - name: Checkout theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(id -u):$(id -g)" /opt/theos

      - name: Prepare theos SDK
        run: |
          export THEOS=/opt/theos
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -fsSL -o iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz \
            || curl -fsSL -o iPhoneOS16.5.sdk.tar.xz \
               https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar -xJf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          ls -d "$THEOS/sdks"/*
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build tweak
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1

      - name: Verify artifacts
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          ls -lh .theos/obj/debug/ 2>/dev/null || true
          ls -lh packages/ 2>/dev/null || true
          file .theos/obj/debug/*.dylib 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweak-${{ inputs.tweak }}
          path: |
            tweaks/${{ inputs.tweak }}/.theos/obj/debug/*.dylib
            tweaks/${{ inputs.tweak }}/packages/*.deb
          if-no-files-found: error
